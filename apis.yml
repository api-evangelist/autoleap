  humanURL: https://developers.myautoleap.com/openapi/profile
  baseURL: https://partnerapi.myautoleap.com/v2
  properties:
  - url: https://developers.myautoleap.com/
    type: Documentation
  - url: https://developers.myautoleap.com/openapi/profile
    type: APIReference
  description: Supporting read endpoints for an integration's own account and a
    shop's operational reference data - partner profile (companies/locations
    the partner can access), staff/user roster, technician timesheet logs,
    canned service packages, tire storage records, and tax settings.
