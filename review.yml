aid: autoleap
name: AutoLeap
review:
  question: Does AutoLeap expose a documented public WebSocket API?
  answer: false
  date: '2026-07-04'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. The AutoLeap Partner API is
    request/response REST over HTTPS - there is no server-push transport
    (WebSocket or SSE) documented anywhere on developers.myautoleap.com.
    List endpoints use standard pagination, not long-lived streaming
    connections, so there is no AsyncAPI-eligible surface to model.
findings:
  summary: |
    AutoLeap does not publish a documented public WebSocket API, and it does
    not publish a general self-serve REST API either. AutoLeap is a per-shop
    subscription (Essentials/Pro/Elite/Enterprise) shop management platform
    with no API included on any of those plans. A separate AutoLeap Partner
    API exists at https://developers.myautoleap.com/, base URL
    https://partnerapi.myautoleap.com/v2, covering repair orders, customers,
    vehicles, appointments, inventory/items, payments, purchase orders,
    suppliers, and partner/settings resources. It is pure request/response
    REST/JSON authenticated with a Bearer access token obtained via a
    partner-login endpoint. Access requires being accepted as an AutoLeap
    partner and issued a Partner ID and Auth Key by an AutoLeap contact - it
    is documented in detail, but it is gated, not self-service, and the docs
    explicitly state it is "not available for Essentials, Pro, and Elite
    plans" purchased directly by a shop. No realtime, bidirectional, or
    streaming WebSocket (ws:// or wss://) endpoint is documented anywhere on
    the developer site.
  openSource: |
    AutoLeap is closed-source, proprietary SaaS. No open-source SDKs,
    client libraries, or self-hosting option were found.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://partnerapi.myautoleap.com/v2
      documented: true
      note: Partner API. All endpoints reviewed are HTTPS REST/JSON.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere on developers.myautoleap.com as of the review date.
