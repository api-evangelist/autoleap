actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on the AutoLeap Partner API. No
    AsyncAPI document was created because every documented endpoint is
    request/response REST/JSON with standard pagination - there is no
    server-push or streaming transport on AutoLeap's own API to model.
