meters:
- name: shop_subscription
  description: Per-location monthly/annual fee for Essentials, Pro, Elite, or Enterprise plan tier.
  unit: locations
  aggregation: sum
  dimensions:
  - account
  - location
  - plan
- name: air_addon
  description: Optional AutoLeap AIR AI-receptionist add-on fee.
  unit: locations
  aggregation: sum
  dimensions:
  - account
  - location
- name: partner_api_grant
  description: Non-metered Partner API access grant; no direct AutoLeap invoice line, tracked for integration inventory purposes only.
  unit: partners
  aggregation: count
  dimensions:
  - partner
principles:
- name: Visibility
  description: Track subscription tier and add-ons per location; separately inventory which third-party partners hold Partner API credentials tied to your shop data.
- name: Allocation
  description: Map each location's subscription cost to that location's P&L; attribute any partner-driven costs (e.g. a parts marketplace fee) to the partner relationship, not to AutoLeap.
- name: Optimization
  description: Right-size plan tier per location's feature needs; consolidate on Enterprise only once location count and ERP/reporting needs justify custom pricing.
- name: Accountability
  description: Assign an owner per location subscription and per approved Partner API integration; review annually at contract renewal.
