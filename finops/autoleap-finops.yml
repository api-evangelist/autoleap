- Shop Management
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of AutoLeap spend. The dominant cost is the per-location
  Essentials/Pro/Elite/Enterprise software subscription, plus optional add-ons
  such as AutoLeap AIR. The Partner API itself is not separately metered or
  billed by AutoLeap to end shops - it is a no-additional-fee integration
  surface granted to approved partners, so it carries no direct FOCUS usage
  meter on its own; any cost impact shows up indirectly through the partner's
  own product (e.g. a parts supplier or payment processor billing the shop
  through their own invoice, not through AutoLeap).
notes: >-
  Because AutoLeap does not publish per-call or per-record API pricing, this
  file models subscription spend rather than API consumption. Revisit if
  AutoLeap introduces metered Partner API pricing.
